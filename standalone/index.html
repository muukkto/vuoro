<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="shortTitle">VUORO</title>
    <link rel="stylesheet" href="src/assets/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html" data-i18n="filePrint">Tulostus</a></li>
            <li><a href="pay_check.html">Palkkalaskelma</a></li>
        </ul>
    </nav>
    <div id="app">
        <h1 id="app-title" data-i18n="title"></h1>
        <div id="language-select-container">
            <label for="language-select" data-i18n="language">Language:</label>
            <select id="language-select">
                <option value="en">English</option>
                <option value="fi" selected>Suomi</option>
            </select>
        </div>
        <h2 data-i18n="filePrint">Tulostus</h2>
        <div id="file-upload-container">
            <label for="exportedFile" data-i18n="uploadShiftCsv"></label>
            <input type="file" id="assignmentFile" accept=".csv,.xlsx,.xls">
            <br>
            <label for="role-select" data-i18n="selectRole">Valitse rooli:</label>
            <select id="role-select">
                <option value="supervisors" data-i18n="messukeskusSupervisors">Messukeskus valvojat</option>
                <option value="it-support" data-i18n="messukeskusItSupport">Messukeskus IT-valvojat</option>
                <option value="keskusta-supervisors" data-i18n="keskustaSupervisors">Keskusta valvojat</option>
                <option value="keskusta-it-support" data-i18n="keskustaItSupport">Keskusta IT-valvojat</option>
            </select>
            <br>
            <button id="uploadAssignmentFileButton" data-i18n="uploadPreview">Lataa ja esikatsele</button>
        </div>
        <div id="schedule-display-container" style="display: none; margin-top: 20px;">
            <button id="schedule-table-button" data-i18n="showShiftsBySupervisor">Näytä vuorot valvojittain</button>
            <button id="summary-table-button" data-i18n="showShiftsByExams">Näytä vuorot kokeittain</button>
            <button id="assign-breaks-button" data-i18n="assignBreaks">Aseta tauot</button>
            <button id="validate-shifts-button" style="background-color:#e67e22;color:#fff;">Tarkista vuorot</button>
            <div id="validation-results-container" style="display:none; margin-top:12px; padding:10px; border:1px solid #ccc; background:#fefefe;"></div>
            <div id="schedule-table-container" style="display: none;"></div>
            <div id="summary-table-container" style="display: none;"></div>
        </div>
        <div id="export-container" style="margin-top: 20px; display: none;">
            <h3 data-i18n="csvExport">CSV-vienti</h3>
            <button id="export-shifts-button" data-i18n="exportShiftsToCsv">Vie vuorot CSV-tiedostoon</button>
            <div id="pdf-container" style="margin-top: 20px;">
                <h3 data-i18n="examSupervisorsExport">Valvojaluetteloiden muodostaminen</h3>
                <label for="exam-select" data-i18n="selectExam">Valitse koe:</label>
                <select id="exam-select">
                    <option value="all" data-i18n="allExams">Kaikki kokeet</option>
                </select>
                <br>
                <div id="hall-select-container" style="display: none;">
                    <label for="hall-select" data-i18n="selectHall">Valitse halli:</label>
                    <select id="hall-select">
                        <option value="all" data-i18n="allSupervisors">Kaikki valvojat</option>
                        <option value="all_by_halls" data-i18n="allByHalls">Kaikki halleittain</option>
                        <option value="all_by_alpha" data-i18n="allByAlpha">Kaikki aakkosjärjestyksessä</option>
                    </select>
                </div>
                <div id="all-by-halls-container" style="margin-top: 10px;">
                    <input type="checkbox" id="all-by-halls-checkbox">
                    <label for="all-by-halls-checkbox" data-i18n="sortByHalls">Järjestä halleittain</label>
                </div>
                <button id="export-pdf-button" data-i18n="exportSupervisorListsToPdf">Vie valvojaluettelot PDF-tiedostoon</button>
            </div>
            <h3 data-i18n="workScheduleExport">Työvuorolistojen muodostaminen</h3>
            <button id="export-supervisors-button" data-i18n="exportWorkSchedulesToPdfs">Vie työvuorot yksittäisiin PDF-tiedostoihin</button>
            <div style="margin-top: 8px;">
                <label for="supervisor-pdf-footer" data-i18n="supervisorPdfFooter">Lisäteksti taulukon alle:</label><br>
                <textarea id="supervisor-pdf-footer" rows="3" style="width: 100%; max-width: 600px; margin-top: 4px;"></textarea>
            </div>
        </div>
    </div>
    <script type="module" src="src/main_print.js"></script>
    <script>
        document.getElementById('schedule-table-button').addEventListener('click', () => {
            const scheduleTableContainer = document.getElementById('schedule-table-container');
            scheduleTableContainer.style.display = scheduleTableContainer.style.display === 'none' ? 'block' : 'none';
        });
        document.getElementById('summary-table-button').addEventListener('click', () => {
            const summaryTableContainer = document.getElementById('summary-table-container');
            summaryTableContainer.style.display = summaryTableContainer.style.display === 'none' ? 'block' : 'none';
        });
    </script>
</body>
</html>
